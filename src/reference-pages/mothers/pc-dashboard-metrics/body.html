<main class="bg-page p-8">
  <div class="container-max col gap-6">
    <header class="toolbar" data-region="header">
      <div class="col gap-1">
        <h1 class="text-2xl font-bold">运营概览</h1>
        <p class="text-sm text-muted">数据更新于今天 09:30</p>
      </div>
      <div class="row gap-2">
        <button class="btn btn-ghost btn-sm">本周</button>
        <button class="btn btn-primary">导出报告</button>
      </div>
    </header>
    <section class="grid-4 gap-4" data-region="main">
      <div class="card shadow-card p-5 col gap-2">
        <span class="text-xs text-muted">本月新增用户</span>
        <span class="text-3xl font-bold">2,847</span>
        <span class="badge-soft text-success">较上月 +12.5%</span>
      </div>
      <div class="card shadow-card p-5 col gap-2">
        <span class="text-xs text-muted">付费转化</span>
        <span class="text-2xl font-semibold">6.8%</span>
        <span class="badge-soft text-warning">略低于目标</span>
      </div>
      <div class="card shadow-card p-5 col gap-2">
        <span class="text-xs text-muted">活跃团队</span>
        <span class="text-2xl font-semibold">412</span>
        <span class="badge-soft text-info">周环比持平</span>
      </div>
      <div class="card shadow-card p-5 col gap-2 surface-subtle">
        <span class="text-xs text-muted">退订率</span>
        <span class="text-2xl font-semibold skeleton">—</span>
        <span class="text-xs text-muted">统计刷新中</span>
      </div>
    </section>
    <div class="grid-2 gap-5 items-start">
      <div class="card shadow-card p-5 col gap-3">
        <h2 class="text-lg font-semibold">渠道表现</h2>
        <div class="col gap-3">
          <div class="row justify-between text-sm"><span>内容投放</span><span class="font-semibold">¥86.2 万</span></div>
          <div class="row justify-between text-sm"><span>私域邀请</span><span class="font-semibold">¥41.5 万</span></div>
          <div class="row justify-between text-sm text-muted"><span>线下活动</span><span>¥12.0 万</span></div>
        </div>
      </div>
      <aside class="card shadow-card p-5 col gap-3" data-region="secondary">
        <h2 class="text-lg font-semibold">待办事项</h2>
        <div class="py-2 is-selected text-sm">复核春季开放日名额</div>
        <div class="py-2 text-sm">同步仓储看板验收结果</div>
        <div class="py-2 text-sm text-muted">整理会员续费文案</div>
      </aside>
    </div>
  </div>
</main>

<main class="col bg-page p-4 gap-4">
  <section class="sheet-card shadow-card p-5 col gap-5" data-region="main">
    <div class="col gap-1">
      <h1 class="text-xl font-bold">预约到店</h1>
      <p class="text-sm text-muted">请填写联系方式，顾问将在 2 小时内回电</p>
    </div>
    <div class="col gap-4">
      <div class="col gap-2">
        <label class="text-sm font-medium">姓名</label>
        <input class="input input-touch" value="周予安" />
      </div>
      <div class="col gap-2">
        <label class="text-sm font-medium">手机号</label>
        <input class="input input-touch" value="138 0013" />

      </div>
      <div class="col gap-2">

      <div class="col gap-2">
        <label class="text-sm font-medium">期望时段</label>
        <input class="input input-touch" value="本周六下午" disabled />
        <span class="text-xs text-muted">该时段已约满时可改选</span>
      </div>
    </div>
    <button class="btn btn-primary">提交预约</button>
  </section>
</main>

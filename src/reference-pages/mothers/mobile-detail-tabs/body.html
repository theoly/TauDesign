<main class="col bg-page">
  <header class="p-4 col gap-3 border-b bg-surface" data-region="header">
    <div class="row items-start justify-between gap-3">
      <div class="col gap-1 min-w-0">
        <h1 class="text-xl font-bold">云杉协作专业版</h1>
        <p class="text-sm text-muted">团队空间 · 12 人在用</p>
      </div>
      <span class="badge-soft text-info">试用中</span>
    </div>
    <div class="row gap-2 scroll-x">
      <button class="btn btn-secondary btn-sm is-active text-nowrap">概览</button>
      <button class="btn btn-ghost btn-sm text-nowrap">成员</button>
      <button class="btn btn-ghost btn-sm text-nowrap">账单</button>
    </div>
  </header>
  <section class="col gap-3 p-4" data-region="main">
    <article class="card shadow-card p-4 col gap-2">
      <h2 class="text-md font-semibold">本月用量</h2>
      <p class="text-sm text-secondary">存储 18.6 GB / 50 GB · 自动化 42 次</p>
      <span class="badge-soft text-success">健康</span>
    </article>
    <article class="card shadow-card p-4 col gap-3">
      <h2 class="text-md font-semibold">最近成员</h2>
      <div class="list-item row items-center gap-3 py-2 is-selected">
        <span class="avatar">林</span>
        <div class="col gap-0 min-w-0 flex-1"><span class="text-sm font-medium">林婉清</span><span class="text-xs text-muted">管理员</span></div>
      </div>
      <div class="list-item row items-center gap-3 py-2">
        <span class="avatar">周</span>
        <div class="col gap-0 min-w-0 flex-1"><span class="text-sm font-medium">周予安</span><span class="text-xs text-muted">编辑</span></div>
      </div>
    </article>
    <div class="card p-4 surface-subtle text-sm text-muted">账单页暂无逾期记录。</div>
    <button class="btn btn-primary">管理订阅</button>
  </section>
</main>

<main class="col bg-page">
  <header class="p-4 col gap-1 border-b bg-surface" data-region="header">
    <h1 class="text-xl font-bold">店铺看板</h1>
    <p class="text-sm text-muted">今日实时 · 西湖银泰店</p>
  </header>
  <section class="col gap-4 p-4" data-region="main">
    <div class="row gap-3 scroll-x">
      <div class="card shadow-card p-4 col gap-1 flex-none">
        <span class="text-xs text-muted">成交额</span>
        <span class="text-2xl font-bold">¥2.4万</span>
        <span class="badge-soft text-success">+8%</span>
      </div>
      <div class="card shadow-card p-4 col gap-1 flex-none is-selected">
        <span class="text-xs text-muted">到店预约</span>
        <span class="text-2xl font-bold">36</span>
        <span class="badge-soft text-info">高峰</span>
      </div>
      <div class="card shadow-card p-4 col gap-1 flex-none surface-subtle">
        <span class="text-xs text-muted">退款</span>
        <span class="text-2xl font-bold skeleton">—</span>
        <span class="text-xs text-muted">刷新中</span>
      </div>
    </div>
    <article class="card shadow-card p-4 col gap-3">
      <h2 class="text-md font-semibold">时段热度</h2>
      <div class="col gap-2 text-sm">
        <div class="row justify-between"><span>10:00–12:00</span><span class="font-medium">偏淡</span></div>
        <div class="row justify-between is-selected"><span>14:00–16:00</span><span class="font-medium text-primary">拥挤</span></div>
        <div class="row justify-between"><span>18:00–20:00</span><span class="font-medium">适中</span></div>
      </div>
    </article>
    <button class="btn btn-primary">查看明细</button>
  </section>
</main>

<main class="col bg-page">
  <header class="p-4 border-b bg-surface" data-region="header">
    <h1 class="text-xl font-bold">设置</h1>
  </header>
  <section class="col gap-4 p-4" data-region="main">
    <div class="col gap-2">
      <h2 class="text-xs text-muted tracking-wide">账户</h2>
      <div class="card shadow-card overflow-hidden">
        <div class="list-item px-4 py-3 row justify-between items-center is-selected">
          <span class="text-sm">个人资料</span><span class="text-xs text-muted">林婉清</span>
        </div>
        <div class="list-item px-4 py-3 row justify-between items-center">
          <span class="text-sm">手机号</span><span class="text-xs text-muted">138****8000</span>
        </div>
      </div>
    </div>
    <div class="col gap-2">
      <h2 class="text-xs text-muted tracking-wide">通知</h2>
      <div class="card shadow-card overflow-hidden">
        <div class="list-item px-4 py-3 row justify-between items-center">
          <div class="col gap-0"><span class="text-sm">活动提醒</span><span class="text-xs text-muted">开课前一天</span></div>
          <button class="btn btn-secondary btn-sm">开</button>
        </div>
        <div class="list-item px-4 py-3 row justify-between items-center">
          <div class="col gap-0"><span class="text-sm">营销邮件</span><span class="text-xs text-muted">可随时退订</span></div>
          <button class="btn btn-ghost btn-sm" disabled>关</button>
        </div>
      </div>
    </div>
    <button class="btn btn-primary">保存设置</button>
  </section>
</main>

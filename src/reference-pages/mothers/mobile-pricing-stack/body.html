<main class="col bg-page p-4 gap-4">
  <header class="col gap-2" data-region="header">
    <h1 class="text-xl font-bold">会员方案</h1>
    <p class="text-sm text-muted">随时升级，按剩余天数折算</p>
  </header>
  <section class="col gap-3" data-region="main">
    <article class="card shadow-card p-4 col gap-3">
      <div class="row justify-between items-center">
        <h2 class="text-md font-semibold">月度会员</h2>
        <span class="text-lg font-bold">¥39</span>
      </div>
      <p class="text-sm text-secondary">适合短期体验全部课程与社群。</p>
      <button class="btn btn-secondary">选择月度</button>
    </article>
    <article class="card shadow-card p-4 col gap-3 border is-selected">
      <div class="row justify-between items-center">
        <div class="row items-center gap-2"><h2 class="text-md font-semibold">年度会员</h2><span class="badge-soft text-primary">更划算</span></div>
        <span class="text-lg font-bold">¥299</span>
      </div>
      <p class="text-sm text-secondary">含线下开放日优先报名与作业点评。</p>
      <button class="btn btn-primary">开通年度</button>
    </article>
    <article class="card p-4 col gap-3 surface-subtle">
      <div class="row justify-between items-center">
        <h2 class="text-md font-semibold">家庭共享</h2>
        <span class="text-sm text-muted">即将开放</span>
      </div>
      <p class="text-sm text-muted">最多 4 位家人共用权益。</p>
      <button class="btn btn-ghost" disabled>加入候补</button>
    </article>
  </section>
</main>

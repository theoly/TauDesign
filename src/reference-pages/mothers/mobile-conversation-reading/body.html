<main class="col bg-page p-4 gap-5">
  <article class="col gap-4" data-region="main">
    <div class="col gap-2">
      <span class="badge-soft is-selected">阅读建议</span>
      <h1 class="text-2xl font-display font-bold tracking-tight">先讲清「谁适合来」</h1>
      <p class="text-sm text-muted">针对陶艺体验课详情页</p>
    </div>
    <p class="text-md leading-relaxed text-secondary">详情里材料、时长、交通挤在同一段，新手很难判断自己是否匹配。建议把「零基础可参加」提前到英雄区副文，把交通与取消规则沉到后续卡片。</p>
    <div class="card shadow-card p-4 col gap-3">
      <h2 class="text-md font-semibold">推荐分段</h2>
      <p class="text-sm text-secondary leading-relaxed">1）适合谁 2）当天流程 3）携带物品 4）改期规则。每段只保留一句主信息，避免列表再套列表。</p>
    </div>
    <p class="text-md leading-relaxed text-secondary">按钮文案用「预约本场」比「立即购买」更贴合到店体验场景，也能降低误触预期。</p>
    <button class="btn btn-primary">按此改写</button>
    <button class="btn btn-ghost">保留原文</button>
  </article>
</main>

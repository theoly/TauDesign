<main class="bg-page p-10">
  <div class="container-max col gap-8">
    <header class="col gap-2" data-region="header">
      <span class="badge-soft">设计建议</span>
      <h1 class="text-3xl font-display font-bold tracking-tight">把首屏主张写短一点</h1>
      <p class="text-md text-muted">基于你提供的会员续费落地页草稿</p>
    </header>
    <article class="col gap-5" data-region="main">
      <p class="text-md leading-relaxed text-secondary">当前标题承载了品牌名、优惠力度与活动时间，读者需要扫两遍才能抓住行动点。建议把主张收束为一句「续费即得春季开放日席位」，把折扣信息降到副文或卡片内。</p>
      <div class="card shadow-card p-5 col gap-3 bg-surface-alt">
        <h2 class="text-lg font-semibold">可试用的结构</h2>
        <ol class="col gap-2 text-sm text-secondary leading-relaxed">
          <li>英雄区：品牌 + 一句主张 + 单一主按钮</li>
          <li>下一节：三条权益，每条一行短句</li>
          <li>页脚：次要链接，不与主 CTA 争抢</li>
        </ol>
      </div>
      <p class="text-md leading-relaxed text-secondary">若必须保留倒计时，请放在英雄区下方独立一行，避免做成漂浮角标压住标题。需要我按这个结构重排文案时，直接说「按建议改稿」。</p>
      <div class="row gap-3 items-center">
        <button class="btn btn-primary">采纳建议</button>
        <button class="btn btn-ghost">另存草稿</button>
        <button class="btn btn-text" disabled>已同步到评论</button>
      </div>
    </article>
  </div>
</main>

<main class="bg-page p-8">
  <div class="container-max col gap-6">
    <header class="toolbar" data-region="header">
      <div class="col gap-1 min-w-0">
        <h1 class="text-2xl font-bold">项目空间</h1>
        <p class="text-sm text-muted">12 个进行中 · 3 个待启动</p>
      </div>
      <button class="btn btn-primary">新建项目</button>
    </header>
    <div class="filter-bar" data-region="filters">
      <button class="btn btn-secondary btn-sm is-selected">全部</button>
      <button class="btn btn-ghost btn-sm">设计</button>
      <button class="btn btn-ghost btn-sm">研发</button>
      <button class="btn btn-ghost btn-sm">运营</button>
    </div>
    <section class="grid-3 gap-5" data-region="main">
      <article class="card shadow-card p-5 col gap-4 is-selected">
        <div class="row justify-between items-start gap-3">
          <div class="col gap-1 min-w-0">
            <h2 class="text-lg font-semibold min-w-0 break-words">春秋茶馆改版</h2>
            <p class="text-sm text-muted">设计组 · 更新于昨天</p>
          </div>
          <span class="badge-soft text-success">进行中</span>
        </div>
        <p class="text-sm text-secondary leading-relaxed">完成菜单页与点单流程高保真，待评审动效节奏。</p>
        <div class="row items-center justify-between">
          <div class="avatar-group"><span class="avatar">婉</span><span class="avatar">予</span><span class="avatar">知</span></div>
          <button class="btn btn-text btn-sm">打开</button>
        </div>
      </article>
      <article class="card shadow-card p-5 col gap-4 card-hover">
        <div class="row justify-between items-start gap-3">
          <div class="col gap-1 min-w-0">
            <h2 class="text-lg font-semibold">会员续费活动</h2>
            <p class="text-sm text-muted">运营组 · 更新于周一</p>
          </div>
          <span class="badge-soft text-warning">待启动</span>
        </div>
        <p class="text-sm text-secondary leading-relaxed">落地页文案已定稿，等待素材与权益规则确认。</p>
        <div class="row items-center justify-between">
          <div class="avatar-group"><span class="avatar">清</span><span class="avatar">安</span></div>
          <button class="btn btn-text btn-sm">打开</button>
        </div>
      </article>
      <article class="card shadow-card p-5 col gap-4 card-hover">
        <div class="row justify-between items-start gap-3">
          <div class="col gap-1 min-w-0">
            <h2 class="text-lg font-semibold">仓储看板</h2>
            <p class="text-sm text-muted">研发组 · 更新于 3 天前</p>
          </div>
          <span class="badge-soft text-info">联调中</span>
        </div>
        <p class="text-sm text-secondary leading-relaxed">指标卡与出入库明细已通，下周验收筛选联动。</p>
        <div class="row items-center justify-between">
          <div class="avatar-group"><span class="avatar">夏</span><span class="avatar">杉</span></div>
          <button class="btn btn-text btn-sm">打开</button>
        </div>
      </article>
    </section>
  </div>
</main>

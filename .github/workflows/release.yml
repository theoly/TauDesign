name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        default: v0.0.1
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: '1.3.5'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      slug: ${{ steps.meta.outputs.slug }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate tag and pin the source commit
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bun scripts/release.mjs metadata
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          printf 'sha=%s\ntag=%s\n' "$commit" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run type-check
      - run: bun run build

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, check]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BUNDLES: ${{ matrix.bundles }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Install Rust toolchain and native target
        run: |
          rustup toolchain install stable --profile minimal --target "$RELEASE_TARGET"
          rustup default stable
      - run: bun install --frozen-lockfile
      - name: Set release version without editing the source configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tauri-release.json
        run: bun scripts/release.mjs config
      - name: Build native release packages
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tauri-release.json
        run: |
          bun run tauri build --ci --target "$RELEASE_TARGET" \
            --bundles "$RELEASE_BUNDLES" --config "$RELEASE_CONFIG" -- --locked
      - name: Collect and verify platform packages
        run: bun scripts/release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish binaries and source
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SLUG: ${{ needs.prepare.outputs.slug }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify the tag and complete binary set
        run: |
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          bun scripts/release.mjs verify
      - name: Archive the exact source commit
        run: |
          prefix="${RELEASE_SLUG}-${RELEASE_TAG}"
          git archive --format=zip --prefix="$prefix/" \
            --output="release-assets/${prefix}-src.zip" "$RELEASE_SHA"
          git archive --format=tar.gz --prefix="$prefix/" \
            --output="release-assets/${prefix}-src.tar.gz" "$RELEASE_SHA"
      - name: Create and verify checksums
        working-directory: release-assets
        run: |
          files=(*)
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload all assets to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo 'This release is already public; refusing to replace its assets.' >&2
              exit 1
            fi
          else
            printf 'Binaries and source built from commit `%s`.\n\nUnsigned builds; macOS builds are not notarized.\n' \
              "$RELEASE_SHA" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --target "$RELEASE_SHA" --title "${RELEASE_SLUG} ${RELEASE_TAG}" \
              --prerelease="$RELEASE_PRERELEASE" --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE"

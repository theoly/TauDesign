import {verifyPublicationAcknowledgements} from '/test/helpers/projectPublicationAck.ts';
import {ProjectRepository} from '/src/services/storage/projectRepository.ts';

window.checkPublicationAck=async()=>{
 const id='ack-browser-'+crypto.randomUUID(),storage=createProjectStorage(id);

};

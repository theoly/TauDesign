<!doctype html><html><meta charset="utf-8"><title>参考图重试链路验收</title><body style="margin:0;background:#020617"><button id="run" style="position:fixed;right:12px;top:12px;z-index:10000">发送合成任务</button><div id="root" style="height:100vh"></div><script type="module">
import {invoke,isTauri} from '@tauri-apps/api/core';

import React from 'react';
import ReactDOM from 'react-dom/client';
import '/src/styles/index.css';
import {ChatDrawer} from '/src/components/chat/ChatDrawer.tsx';
import {useAIEngineChat} from '/src/services/ai/engine/react/useAIEngineChat.ts';
import {PipelineExecutor} from '/src/services/ai/engine/pipeline/executor.ts';
import {DefaultAIEngineCore} from '/src/services/ai/engine/core/aiEngineCore.ts';
import {useProjectStore} from '/src/stores/useProjectStore.ts';

import {techBlueTheme} from '/src/utils/themePresets.ts';
import {endpointIdentity} from '/src/services/ai/modelCapabilities.ts';
const nativeRoot=new URLSearchParams(location.search).get('root');if(nativeRoot&&(!isTauri()||!/^\/private\/tmp\/td-ref-native-[A-Za-z0-9_-]+$/.test(nativeRoot)))throw Error('Only isolated native test folders allowed');
if(nativeRoot)await invoke('project_ensure_dir',{root:nativeRoot,rel:'project.aidesign'});
const state=useProjectStore.getState();state.initNewProject({...(nativeRoot?{folderPath:nativeRoot+'/project.aidesign'}:{}),name:'独立合成重试验收',deviceProfile:new URLSearchParams(location.search).get('device')==='pc'?'pc':'mobile',designSystem:techBlueTheme,createSpecimen:false});
const original='<main data-nid="root0001" class="p-4 col gap-4"><h1 data-nid="head0001">完善资料</h1></main>';state.addScreen({name:'完善资料',htmlContent:original},'source');
if(nativeRoot)await state.saveProjectChecked();
const provider={id:'fixture',name:'合成网关（不出网）',protocol:'openai_compatible',baseUrl:'https://fixture.invalid/v1',apiKey:'SYNTHETIC_NOT_A_KEY',isEnabled:true};
provider.modelCapabilities={code:{version:1,revision:'1',source:'user',endpointIdentity:endpointIdentity(provider),contextWindow:131072,maxOutputTokens:8192,thinkingControl:'deepseek'},vision:{version:1,revision:'1',source:'user',endpointIdentity:endpointIdentity(provider),contextWindow:131072,maxOutputTokens:8192,mediaInput:'native-part'}};
useAIConfigStore.setState({providers:[provider],bindings:{...defaultBindings,code:{role:'code',providerId:'fixture',modelId:'code'},chat:{role:'chat',providerId:'fixture',modelId:'code'},vision:{role:'vision',providerId:'fixture',modelId:'vision'}}});
const canvas=document.createElement('canvas');canvas.width=390;canvas.height=new URLSearchParams(location.search).has('long')?5000:640;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,390,canvas.height);ctx.fillStyle='#222';ctx.font='22px sans-serif';ctx.fillText('基础资料',24,50);ctx.fillText('身高（必填）',24,110);ctx.strokeRect(24,130,340,48);ctx.fillText('保存',24,250);const image={name:'synthetic-form.png',dataUrl:canvas.toDataURL('image/png')};
const observation={summary:'基础资料表单',texts:['基础资料','身高','保存'],groups:[{title:'基础资料',items:['身高'],position:'顶部单列'}],fields:[{label:'身高',type:'number',required:true,group:'基础资料',value:''}],visual:['浅色背景，单列标签和输入框'],uncertainties:[]};
const plan={goal:'填写并保存基础资料',actor:'当前用户',completion:['本页填写并保存'],questions:[],features:[{id:'f1',title:'基础资料',change:'add',basis:'user',sourceIds:['user:request'],information:[{label:'身高',kind:'input'}],interactions:[{label:'保存',precondition:'必填有效',outcome:'展示保存结果',targetScreenId:''}],states:[{name:'待填写',condition:'未填写',feedback:'请填写身高'}]}]};
const fixture={ready:false,requests:[],outputs:[],original,failRemaining:2,state:()=>useProjectStore.getState(),history:()=>useHistoryStore.getState(),before:useHistoryStore.getState().past.length};window.retryReferenceFixture=fixture;
const core=new DefaultAIEngineCore({id:'synthetic-only',stream(request,event){const body=request.body,text=JSON.stringify(body);const kind=body.model==='vision'?'vision':text.includes('TAUDESIGN_JSON_SCHEMA')?'plan':'code';fixture.requests.push({kind,body,at:Date.now()});const id=String(fixture.requests.length);event({type:'RequestStarted',requestId:id,attemptId:id,eventProtocol:'typed',at:Date.now()});event({type:'TransportAttempt',attemptId:id,at:Date.now()});event({type:'Connected',at:Date.now(),http_status:200});
 const promise=Promise.resolve().then(()=>{event({type:'Usage',input_tokens:120,output_tokens:200});if(kind==='vision')event({type:'Delta',text:JSON.stringify(observation)});else if(kind==='plan')event({type:'Delta',text:JSON.stringify(plan)});else if(fixture.failRemaining>0){fixture.failRemaining--;event({type:'ReasoningDelta',text:'合成回放：仅推理而无代码。'});event({type:'Done',finish_reason:'length'});return;}else event({type:'Delta',text:'<artifact type="screen" title="完善资料"><main data-nid="root0001" class="p-4 col gap-4"><h1 data-nid="head0001">完善资料</h1><section class="col gap-3"><h2 class="text-lg">基础资料</h2><label class="col gap-2">身高<input class="input" type="number" required aria-label="身高" placeholder="请输入身高"/></label><button class="btn btn-primary">保存</button></section></main></artifact>'});event({type:'Done',finish_reason:'stop'});});return {abort(){},promise};}});
const execute=PipelineExecutor.execute;PipelineExecutor.execute=async o=>{const output=await execute({...o,engineCore:core});fixture.outputs.push(output);return output;};
function Launcher(){const engine=useAIEngineChat();fixture.engine=engine;return null;}
let chatRoot=ReactDOM.createRoot(document.getElementById('root'));chatRoot.render(React.createElement(ChatDrawer));
// Remount only the UI, retaining the same isolated project and its persisted conversation.
fixture.reopenChat=()=>{chatRoot.unmount();chatRoot=ReactDOM.createRoot(document.getElementById('root'));chatRoot.render(React.createElement(ChatDrawer));};
// Use ChatDrawer's own engine for all UI state; intercepted send is captured through the real submit controls.
document.getElementById('run').onclick=()=>{const textarea=document.querySelector('textarea');const setter=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set;setter.call(textarea,'修改当前页面 @完善资料，增加基础资料表单，保留当前页填写，不用跳转。');textarea.dispatchEvent(new Event('input',{bubbles:true}));const input=document.querySelector('input[type="file"][accept*="image"]');const binary=atob(image.dataUrl.split(',')[1]),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const file=new File([bytes],'synthetic-form.png',{type:'image/png'});const dt=new DataTransfer();dt.items.add(file);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));};
fixture.verifyFiles=async()=>{const live=useProjectStore.getState(),storage=createProjectStorage(live.id,live.folderPath),tasks=await listDesignTasks(storage,live.id,true);const saved=[];for(const task of tasks){const read=await readDesignTask(storage,live.id,task.id);if(!read)throw Error('独立任务无法重读');const e=read.task.contract.referenceImage?.evidence;if(e){if(!await storage.exists(e.sourcePath)||!await storage.readBinary(e.sourcePath))throw Error('原图丢失');for(const part of e.parts)if(!await storage.exists(part.relPath))throw Error('发送副本丢失');saved.push({id:task.id,state:task.state,fields:e.observation.fields.map(f=>f.label),parts:e.parts.length,requests:task.budget?.requests});}}return saved;};
let proofPending=false;
const recordNativeProof=async()=>{const preview=[...document.querySelectorAll('img')].find(i=>i.src.includes('aidesign-media'));if(proofPending||fixture.outputs.length<2||!useProjectStore.getState().stagedScreen||!preview?.complete||!preview.naturalWidth)return;proofPending=true;try{const files=await fixture.verifyFiles(),live=useProjectStore.getState();await invoke('project_write_text_atomic',{root:nativeRoot,rel:'result.json',contents:JSON.stringify({status:'passed',runtime:'real-tauri',preview:{url:preview.src,width:preview.naturalWidth,height:preview.naturalHeight,region:preview.alt},requests:fixture.requests.map(r=>r.kind),sourceUnchanged:live.screens.source.htmlContent===original,historyUnchanged:useHistoryStore.getState().past.length===fixture.before,codeNoImages:fixture.requests.filter(r=>r.kind!=='vision').every(r=>r.body.messages.every(m=>typeof m.content==='string')),files},null,2)});}catch(error){await invoke('project_write_text_atomic',{root:nativeRoot,rel:'result.json',contents:JSON.stringify({status:'failed',error:String(error)})});}};
if(nativeRoot){new MutationObserver(recordNativeProof).observe(document.getElementById('root'),{subtree:true,childList:true});document.addEventListener('load',recordNativeProof,true);}
fixture.ready=true;
</script></body></html>

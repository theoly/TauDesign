import React from '/node_modules/.vite/deps/react.js';

import '/src/styles/index.css';
import {RestylePanel} from '/src/components/theme/RestylePanel.tsx';

import {useAIConfigStore} from '/src/stores/useAIConfigStore.ts';
import {DefaultAIEngineCore} from '/src/services/ai/engine/core/aiEngineCore.ts';
import {createRestylePatchPlan} from '/src/services/ai/restylePatches.ts';

s.initNewProject({name:'大页只读样本验证',deviceProfile:'mobile',designSystem:input.designSystem,createSpecimen:false});
s.addScreen({name:'TA 的主页',htmlContent:input.html,metadata:input.metadata,position:{x:0,y:0}},'large');

<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到奖励</title>
    <style id="theme-vars">
:root {
  --amf-background: #fdf6ee;
  --amf-page: #f7efe5;
  --amf-card: #ffffff;
  --amf-muted: #f5ecdf;
  --amf-soft: #faf2e6;
  --amf-foreground: #2a1f14;
  --amf-muted-foreground: #6b5a45;
  --amf-faint: #a89578;
  --amf-border: rgba(42, 31, 20, 0.08);
  --amf-border-strong: rgba(42, 31, 20, 0.16);
  --amf-primary: oklch(0.72 0.16 42);
  --amf-primary-soft: oklch(0.92 0.06 42);
  --amf-primary-deep: oklch(0.55 0.17 42);
  --amf-mint: oklch(0.82 0.09 165);
  --amf-lilac: oklch(0.78 0.09 295);
  --amf-sun: oklch(0.86 0.11 85);
  --amf-sky: oklch(0.82 0.08 230);
  --amf-rose: oklch(0.8 0.11 15);
  --amf-success: oklch(0.65 0.13 160);
  --amf-warning: oklch(0.74 0.14 75);
  --amf-danger: oklch(0.62 0.18 25);
  --amf-font-primary: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Alibaba PuHuiTi", system-ui, sans-serif;
  --amf-radius-sm: 10px;
  --amf-radius-md: 14px;
  --amf-radius-lg: 20px;
  --amf-radius-xl: 28px;
  --amf-shadow-card: 0 14px 28px rgba(42, 31, 20, 0.05);
  --amf-shadow-float: 0 24px 48px rgba(42, 31, 20, 0.12);
}
html, body { font-family: var(--amf-font-primary); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--amf-background);
    --color-foreground: var(--amf-foreground);
    --color-card: var(--amf-card);
    --color-primary: var(--amf-primary);
    --color-muted: var(--amf-muted);
    --color-muted-foreground: var(--amf-muted-foreground);
    --color-border: var(--amf-border);
  }
  @layer base {
    body { background: var(--amf-background); color: var(--amf-foreground); }
  }
    </style>
    <style>
      .no-wrap { white-space: nowrap; }
      .gradient-warm { background: linear-gradient(160deg, #fcd9b8 0%, #f5b27a 45%, #e89060 100%); }
      .gradient-primary { background: linear-gradient(135deg, var(--amf-primary), var(--amf-primary-deep)); }
      .text-gradient {
        background: linear-gradient(135deg, #fff5e0, #fcd9b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .coin-pop {
        animation: coinPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes coinPop {
        0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
        60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
      }
      .confetti {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        opacity: 0.85;
      }
      .badge-glow {
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.6), 0 8px 32px rgba(232, 144, 96, 0.4);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <div class="min-h-screen relative overflow-hidden bg-[var(--amf-background)]">

            <!-- Backdrop (dimmed source page) -->
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

            <!-- ==================== MODAL ==================== -->
            <div class="relative z-10 min-h-screen flex items-end justify-center px-3 pb-6 pt-12">

                <div class="w-full max-w-[400px] rounded-[28px] overflow-hidden gradient-warm relative" style="box-shadow: 0 32px 64px rgba(42, 31, 20, 0.28);">

                    <!-- Confetti -->
                    <div class="confetti" style="top: 12%; left: 12%; background: #fff5e0; transform: rotate(15deg);"></div>
                    <div class="confetti" style="top: 18%; right: 14%; background: var(--amf-sun); transform: rotate(-25deg);"></div>
                    <div class="confetti" style="top: 32%; left: 8%; background: var(--amf-rose); transform: rotate(45deg);"></div>
                    <div class="confetti" style="top: 40%; right: 8%; background: #fff; transform: rotate(-15deg);"></div>
                    <div class="confetti" style="top: 56%; left: 16%; background: var(--amf-sun); transform: rotate(60deg);"></div>
                    <div class="confetti" style="top: 22%; left: 50%; background: #fff5e0; transform: rotate(-40deg);"></div>
                    <div class="confetti" style="top: 50%; right: 20%; background: var(--amf-rose); transform: rotate(20deg);"></div>

                    <!-- Close button -->
                    <button data-dom-id="close-reward" class="absolute right-4 top-4 z-20 w-8 h-8 rounded-full bg-black/15 backdrop-blur-md flex items-center justify-center text-white" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4"></i>
                    </button>

                    <!-- Top hero -->
                    <div class="pt-10 pb-6 px-6 text-center text-white">
                        <p class="text-[11px] font-medium uppercase tracking-[0.2em] text-white/85 mb-2">每月奖励</p>
                        <h1 class="text-[28px] font-extrabold leading-tight text-gradient drop-shadow-sm">签到成功</h1>

                    </div>

                    <!-- Coin badge -->
                    <div class="flex justify-center -mt-2 mb-5">
                        <div class="coin-pop w-[112px] h-[112px] rounded-full bg-gradient-to-br from-[#fff5e0] to-[#fcd9b8] flex items-center justify-center badge-glow relative">
                            <i data-lucide="coins" class="h-12 w-12" style="color: var(--amf-primary-deep);"></i>
                            <span class="absolute -bottom-1 -right-1 px-2 py-0.5 rounded-full bg-white text-[10px] font-bold" style="color: var(--amf-primary-deep);">+50</span>
                        </div>
                    </div>

                    <!-- Reward card -->
                    <div class="mx-5 rounded-2xl bg-white/95 backdrop-blur px-5 py-4 mb-4" style="box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);">
                        <div class="text-[12px] font-semibold text-[var(--amf-muted-foreground)] text-center mb-3">本次获得</div>

                        <!-- Primary reward -->
                        <div class="flex items-center gap-3 mb-3 pb-3 border-b border-dashed border-[var(--amf-border-strong)]">
                            <div class="w-11 h-11 rounded-xl bg-[var(--amf-primary-soft)] flex items-center justify-center shrink-0">
                                <i data-lucide="coins" class="h-5 w-5" style="color: var(--amf-primary-deep);"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[14px] font-bold text-[var(--amf-foreground)]">+50 金币</div>
                                <div class="text-[11px] text-[var(--amf-faint)]">可用于解锁专属功能</div>
                            </div>
                        </div>

                        <!-- Secondary rewards -->
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-xl bg-[var(--amf-primary-soft)] flex items-center justify-center shrink-0">
                                <i data-lucide="gift" class="h-5 w-5" style="color: var(--amf-primary-deep);"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[14px] font-bold text-[var(--amf-foreground)]">+300 金币</div>
                                <div class="text-[11px] text-[var(--amf-faint)]">月度奖励发放</div>
                            </div>
                        </div>

                    </div>

                    <!-- Streak progress -->


                    <!-- Lucky bonus teaser -->


                    <!-- Actions -->
                    <div class="px-5 pb-6 flex flex-col gap-2">


                    </div>
                </div>
            </div>

        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

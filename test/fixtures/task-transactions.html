<!doctype html><html><meta charset="utf-8"><title>独立窗口任务事务验证</title><body><p>受控本地任务事务验证，不调用模型。</p><script type="module">
import {LocalStorageStorage} from '/src/services/storage/projectStorage.ts';
import {migrateProjectBundle} from '/src/services/storage/projectBundleMigration.ts';
import {neutralModernTheme} from '/src/utils/themePresets.ts';
import {ProjectRepository} from '/src/services/storage/projectRepository.ts';
const group=new URLSearchParams(location.search).get('group');if(!group)throw Error('isolated storage group required');const storage=new LocalStorageStorage('task-browser-'+group),id='design-browser-shared';
const archives=new LocalStorageStorage('task-archive-browser-'+group);
const publication=new LocalStorageStorage('project-publication-browser-'+group);
const body=(id,sequence=0)=>JSON.stringify({version:1,id,projectId:'p',state:'draft',sequence});
window.taskTransactionFixture={
 projectSeed:async()=>{await publication.writeTextAtomic('project.json','{"id":"old"}');await publication.writeTextAtomic('screens/page.html','<main>old</main>');await publication.writeTextAtomic('screens/page.css','old CSS');return (await publication.readManagedSnapshot()).identity;},
 projectPublish:async(expected,label)=>{try{const identity=await publication.publishManagedSnapshot(expected,[{path:'project.json',contents:JSON.stringify({id:label})},{path:'screens/page.html',contents:`<main>${label}</main>`},{path:'screens/page.css',contents:null},{path:'documents/brief.md',contents:label+' requirements'}]);return {ok:true,identity};}catch(error){return {ok:false,message:error.message};}},
 projectRead:()=>publication.readManagedSnapshot(),
 projectAbort:async()=>{const before=await publication.readManagedSnapshot();await new Promise((resolve,reject)=>{const request=indexedDB.open('taudesign-managed-projects-v1',1);request.onerror=()=>reject(Error('DB open failed'));request.onsuccess=()=>{const db=request.result,tx=db.transaction('projects','readwrite'),store=tx.objectStore('projects'),read=store.get(publication.scopeKey);read.onsuccess=()=>{const changed=structuredClone(read.result);changed.files['screens/page.html']='aborted transaction';store.put(changed,publication.scopeKey);tx.abort();};tx.onabort=()=>{db.close();resolve();};tx.oncomplete=()=>{db.close();reject(Error('Abort transaction unexpectedly committed'));};tx.onerror=()=>{};};});const after=await publication.readManagedSnapshot();if(JSON.stringify(before)!==JSON.stringify(after))throw Error('Aborted transaction changed source');return {aborted:true,identity:after.identity,unchanged:true};},
 importArchive:async n=>{try{await archives.importTaskArchive('design-archive',[{path:'manifest.json',contents:'historical-'+n},{path:'artifacts/region.html',contents:'historical-'+n},{path:'attempts.jsonl',contents:'{"usage":"unknown"}\n{broken'}]);return {ok:true};}catch(error){return {ok:false,message:error.message};}},
 archiveRead:async()=>({manifest:await archives.readText('tasks/design-archive/manifest.json'),part:await archives.readText('tasks/design-archive/artifacts/region.html')}),
 migrateArchive:async()=>{await archives.importTaskArchive('design-deleted',[],'historical deletion marker',false);const target=new LocalStorageStorage('task-migration-target-'+group),html='<main>保留原页面</main>',doc={id:'migration-'+group,name:'任务迁移验证',settings:{deviceProfile:'mobile',frameWidth:390,colorMode:'light',lodBudget:12},designSystem:neutralModernTheme,screens:{page:{id:'page',name:'保留页',htmlContent:html,position:{x:0,y:0}}},assets:{},components:{},overrides:{}};
  const before=await archives.readText('tasks/design-archive/manifest.json'),sourceJson=JSON.stringify(doc),result=await migrateProjectBundle({sourceJson,source:archives,target,historyRaw:null,readHistory:()=>null,checkCurrent:()=>{}});let resurrected=false;try{await target.publishTaskManifest('design-deleted',null,body('design-deleted'));resurrected=true;}catch{}
  return {ok:result.ok,warnings:result.warnings,sourceExact:await archives.readText('tasks/design-archive/manifest.json')===before,manifestExact:await target.readText('tasks/design-archive/manifest.json')===before,partExact:await target.readText('tasks/design-archive/artifacts/region.html')===await archives.readText('tasks/design-archive/artifacts/region.html'),tracesExact:await target.readText('tasks/design-archive/attempts.jsonl')===await archives.readText('tasks/design-archive/attempts.jsonl'),deletedExact:await target.readText('tasks/.locks/design-deleted.deleted')==='historical deletion marker',pageExact:(await new ProjectRepository(target).load())?.screens.page.htmlContent===html,resurrected};},
 seed:()=>storage.publishTaskManifest(id,null,body(id)),identity:()=>storage.taskManifestIdentity(id),read:()=>storage.readText(`tasks/${id}/manifest.json`),
 publish:async(expected,sequence)=>{try{await storage.publishTaskManifest(id,expected,body(id,sequence));return {ok:true};}catch(error){return {ok:false,message:error.message};}},
 remove:expected=>storage.deleteDesignTask(id,expected),
 late:async(expected)=>{const actions=[()=>storage.publishTaskManifest(id,expected,body(id,99)),()=>storage.writeTextAtomic(`tasks/${id}/artifacts/late.html`,'<main>late</main>'),()=>storage.appendLine(`tasks/${id}/attempts.jsonl`,'{}')],results=[];for(const action of actions)try{await action();results.push({ok:true});}catch(error){results.push({ok:false,message:error.message});}return {results,files:await storage.listDir(`tasks/${id}`)};},
 quotaSeed:async()=>{for(let n=0;n<39;n++)await storage.writeTextAtomic(`tasks/design-quota-${n}/reserved.txt`,'reserved');},
 quotaPublish:async suffix=>{const target='design-quota-'+suffix;try{await storage.publishTaskManifest(target,null,body(target));return {ok:true};}catch(error){return {ok:false,message:error.message};}},
 count:async()=>new Set((await storage.listDir('tasks')).map(path=>path.split('/')[0]).filter(id=>id.startsWith('design-'))).size
};
</script></body></html>

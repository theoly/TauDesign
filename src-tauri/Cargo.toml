[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "=2.7.3"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
png = "0.17"

# 高保真 PNG 导出 (doc/feature/high-fidelity-png-export)：
# 走 WKWebView.createPDF 整页渲染 + CoreGraphics 栅格化，版本与 tauri/wry 依赖树保持一致
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKPDFConfiguration", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGPDFDocument",
    "CGPDFPage",
    "CGContext",
    "CGBitmapContext",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
    "CGPDFContext",
    "CGDataConsumer",
] }
